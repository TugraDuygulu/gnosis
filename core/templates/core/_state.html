{% if state == "full" %}<span class="pill full"><svg aria-hidden="true"><use href="#i-full"/></svg>Fully graded</span>{% elif state == "some" %}<span class="pill some"><svg aria-hidden="true"><use href="#i-some"/></svg>Some grades missing</span>{% elif state == "none" %}<span class="pill none"><svg aria-hidden="true"><use href="#i-none"/></svg>Not graded yet</span>{% elif state == "error" %}<span class="pill error">Cannot calculate</span>{% else %}<span class="pill unmeasured"><svg aria-hidden="true"><use href="#i-unmeasured"/></svg>Not measured</span>{% endif %}
